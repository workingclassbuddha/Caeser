[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caesar-constraint-dynamics"
version = "0.1.0"
description = "A constraint-dynamics-inspired recurrent actor-critic research prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Matthew A. Cator" }
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[tool.setuptools]
packages = ["caesar"]
