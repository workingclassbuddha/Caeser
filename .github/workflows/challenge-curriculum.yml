name: CAESAR v2 graduated constraint comparison

on:
  pull_request:

jobs:
  progressive-vs-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install packages and pytest
        run: python -m pip install -e . pytest
      - name: Validate intervention, seeds and full-hard evaluation
        run: python -m pytest -q tests/test_challenge_curriculum.py
      - name: Run matched fixed-hard versus graduated-constraint training
        run: |
          python -m caesar.challenge_curriculum \
            --seeds 11 23 --episodes 90 --trials 4 \
            --output outputs/curriculum_v2_pilot.json
      - name: Retain all episode trajectories and held-out trials
        uses: actions/upload-artifact@v4
        with:
          name: caesar-v2-progressive-constraint-pilot
          path: outputs/curriculum_v2_pilot.json
          if-no-files-found: error
