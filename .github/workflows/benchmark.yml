name: Paired ablation tools

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ablation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install benchmark dependencies
        run: python -m pip install -e . pytest
      - name: Check benchmark and observer tests
        run: python -m pytest -q tests/test_benchmark.py tests/test_observer.py tests/test_scar_probe.py
      - name: Probe stock scar activation
        run: python -m caesar.scar_probe --seed 42 --episodes 3 --level 0
      - name: Scan stock activation across 5 seeds and 2 difficulty levels
        run: python -m caesar.scar_probe --scan --episodes 1 --output outputs/scar_activation_scan.json
      - name: Upload reproducible probe logs
        uses: actions/upload-artifact@v4
        with:
          name: caesar-scar-probes
          path: |
            outputs/scar_trigger_probe.json
            outputs/scar_activation_scan.json
