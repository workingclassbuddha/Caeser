name: CAESAR v2 causal GRU history and one-bit control

on:
  pull_request:

jobs:
  frozen-history-causal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install CAESAR and pytest
        run: python -m pip install -e . pytest
      - name: Validate same-state history intervention and one-bit scanner
        run: python -m pytest -q tests/test_memory_causal_probe.py
      - name: Run seeded frozen-weight trained vs untrained memory diagnostic
        run: |
          python -m caesar.memory_causal_probe \
            --seeds 11 23 --train-episodes 50 --probe-trials 12 \
            --control-trials 8 \
            --output outputs/caesar_gru_memory_pilot.json
      - name: Preserve raw per-pair neural actions and per-trial controller outcomes
        uses: actions/upload-artifact@v4
        with:
          name: caesar-v2-causal-history-and-stored-bit
          path: outputs/caesar_gru_memory_pilot.json
          if-no-files-found: error
